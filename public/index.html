<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>无人负责 · 夜行列车</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b1026'/%3E%3Crect x='2' y='2' width='3' height='12' fill='%23e8ecff'/%3E%3Crect x='6' y='2' width='3' height='12' fill='%23e8ecff'/%3E%3Crect x='10' y='2' width='3' height='12' fill='%23e8ecff'/%3E%3Crect x='2' y='7' width='7' height='3' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div class="crt" aria-hidden="true"></div>
<div id="app">

  <header class="topbar">
    <div class="logo">像素抽签</div>
    <div class="topright">
      <button id="btn-exit" class="btn small exit-btn hidden">退出</button>
      <span id="room-chip" class="chip hidden"></span>
      <span id="audio-ind" class="audio-ind hidden" title="正在收听">🔊</span>
      <span id="conn-dot" class="conn-dot" title="连接状态"></span>
      <button id="btn-sound" class="icon-btn" aria-label="声音开关">♪</button>
    </div>
  </header>

  <main>

    <!-- 首页 -->
    <section id="screen-home" class="screen">
      <div class="hero">
        <div class="hero-title">NOBODY DID IT</div>
        <div class="hero-sub">无人负责 · 夜行列车 · 命运抽签</div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="create">创建房间</button>
        <button class="tab" data-tab="join">加入房间</button>
      </div>
      <div class="panel" id="tab-create">
        <label>你的昵称</label>
        <input id="in-name" maxlength="8" placeholder="玩家1">
        <label>底部结果（每行一个，2-12 项）</label>
        <textarea id="in-results" rows="5"></textarea>
        <label>最终选择方式</label>
        <select id="in-mode" class="mode-select">
          <option value="individual">各自选择 · N 人各出各的结果</option>
          <option value="host">房主选择 · 全员出一个结果</option>
          <option value="vote">投票选择 · 投票出一个结果</option>
        </select>
        <button id="btn-create" class="btn primary big">开 房</button>
      </div>
      <div class="panel hidden" id="tab-join">
        <label>你的昵称</label>
        <input id="in-name2" maxlength="8" placeholder="玩家1">
        <label>房间码</label>
        <input id="in-code" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase;letter-spacing:2px">
        <button id="btn-join" class="btn primary big">加入房间</button>
      </div>
      <div class="footnote">每个人都扳下命运的道岔<br>→ 选择登车站 → 列车夜行，全员同时揭晓</div>
    </section>

    <!-- 大厅 -->
    <section id="screen-lobby" class="screen hidden">
      <div class="panel">
        <label>房间码</label>
        <div class="code-row">
          <span id="lobby-code" class="code"></span>
          <button id="btn-copy" class="btn small">复制</button>
        </div>
        <div class="share-hint">把链接或房间码发给朋友一起玩</div>
      </div>
      <div class="panel">
        <label>参与者 <span id="pcount"></span></label>
        <ul id="player-list" class="player-list"></ul>
      </div>
      <div class="panel">
        <button id="btn-mic-test" class="btn">🎤 测试麦克风（录 1 秒回放）</button>
        <div id="mic-test-result" class="share-hint" style="margin-top:8px">公网 https 下测试语音功能是否可用</div>
      </div>
      <div class="panel">
        <label>结果</label>
        <div id="result-list" class="result-list"></div>
      </div>
      <div class="panel host-only hidden" id="panel-config">
        <div class="share-hint">画线由房主随时决定结束</div>
        <div class="mode-row">
          <div class="mode-col">
            <label>最终选择方式</label>
            <select id="in-mode2" class="mode-select">
              <option value="individual">各自选择 · N 人各出各的结果</option>
              <option value="host">房主选择 · 全员出一个结果</option>
              <option value="vote">投票选择 · 投票出一个结果</option>
            </select>
          </div>
          <div class="mode-col">
            <label>画线轮次</label>
            <button id="btn-round" class="btn small round-toggle">多轮</button>
          </div>
          <div class="mode-col">
            <label>最高笔画数</label>
            <select id="in-maxlines" class="mode-select">
              <option value="20">20</option>
              <option value="40">40</option>
              <option value="80">80</option>
            </select>
          </div>
          <div class="mode-col">
            <label>夜色雾</label>
            <button id="btn-fog" class="btn small round-toggle">迷雾开启</button>
          </div>
        </div>
        <div id="round-hint" class="share-hint" style="margin-top:6px"></div>
      </div>
      <div class="panel host-only hidden" id="panel-bg">
        <label>自定义背景（可选）</label>
        <div class="share-hint">上传图片将像素化并以低透明度衬在画板下方，不影响走线</div>
        <input type="file" id="in-bg" accept="image/*" class="file-input">
        <canvas id="bg-preview" class="bg-preview hidden" width="192" height="144"></canvas>
        <div class="row" style="margin-top:6px">
          <button id="btn-bg-set" class="btn small">应用背景</button>
          <button id="btn-bg-clear" class="btn small">清除背景</button>
        </div>
      </div>
      <div id="overflow-note" class="waiting-hint hidden">参与者多于选项数，超出者本轮将作为观众</div>
      <button id="btn-start" class="btn primary big host-only hidden">开始施工</button>
      <div id="waiting-hint" class="waiting-hint">等待房主开始…</div>
    </section>

    <!-- 修改结果弹层 -->
    <div id="modal-edit" class="modal hidden">
      <div class="modal-box panel">
        <label>编辑结果（每行一个）</label>
        <textarea id="in-edit-results" rows="6"></textarea>
        <div class="row">
          <button id="btn-edit-cancel" class="btn">取消</button>
          <button id="btn-edit-save" class="btn primary">保存</button>
        </div>
      </div>
    </div>

    <!-- 游戏板（画线 / 选点 / 揭晓） -->
    <section id="screen-board" class="screen hidden">
      <div id="turn-banner" class="banner"></div>
      <div class="canvas-wrap"><canvas id="board"></canvas></div>
      <div id="control-bar" class="control-bar"></div>
      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
    </section>

    <!-- 揭晓完毕 -->
    <section id="screen-done" class="screen hidden">
      <div class="panel">
        <div class="done-title">— 揭晓完毕 —</div>
        <ul id="done-list" class="done-list"></ul>
        <div id="done-group" class="done-group hidden"></div>
      </div>
      <button id="btn-again" class="btn primary big host-only hidden">再来一局</button>
      <button id="btn-reconfig" class="btn big host-only hidden">修改结果重开</button>

      <!-- 事故调查回放（所有玩家可见） -->
      <div class="panel" id="replay-panel">
        <div class="done-title">— 事故调查回放 —</div>
        <div id="replay-report" class="replay-report"></div>
        <div class="replay-quote">「没有人对把列车送到这里负全责<br>——但每个人都帮了一点忙」</div>
        <canvas id="replay-board" class="replay-board"></canvas>
      </div>

      <div class="waiting-hint" id="done-waiting">等待房主决定下一局…</div>
    </section>

  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
<script src="audio.js"></script>
<script src="voice.js"></script>
<script src="board.js"></script>
<script src="pixelate.js"></script>
<script src="state.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
<script src="input.js"></script>
<script src="app.js"></script>
</body>
</html>
