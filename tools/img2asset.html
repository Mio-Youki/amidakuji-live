<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素风小动画装配器 · Pixel Scene Builder</title>
<style>
  :root { --bg:#0b1026; --panel:#141b3d; --ink:#e8ecff; --dim:#8b93c7; --yellow:#ffd23f; --cyan:#4dc3ff; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: monospace; margin: 0; padding: 14px; }
  h1 { color: var(--yellow); font-size: 13px; letter-spacing: 2px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 10px; margin-bottom: 12px; }
  .cols { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; min-height: calc(100vh - 96px); }
  .panel { background: var(--panel); border: 3px solid #0a0e22; padding: 12px; }
  .p-import { width: 300px; }
  .p-stage { flex: 1; min-width: 420px; }
  .p-props { width: 320px; display: flex; flex-direction: column; }
  label { display: block; font-size: 9px; color: var(--dim); margin: 9px 0 3px; letter-spacing: 1px; }
  input[type=text], input[type=number], select {
    width: 100%; background: #0d1330; color: var(--ink); border: 2px solid var(--dim);
    padding: 6px; font-family: inherit; font-size: 11px; outline: none;
  }
  input[type=range] { width: 100%; accent-color: var(--yellow); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row input[type=number] { width: 70px; }
  .drop {
    border: 3px dashed var(--dim); padding: 18px; text-align: center; font-size: 10px;
    color: var(--dim); cursor: pointer; margin-top: 8px;
  }
  .drop.over { border-color: var(--yellow); color: var(--yellow); }
  button {
    background: #1a2350; color: var(--ink); border: 3px solid #0a0e22; font-family: inherit;
    font-size: 10px; padding: 8px 10px; cursor: pointer; margin-top: 8px; min-height: 36px;
  }
  button.primary { background: var(--yellow); color: #0b1026; border-color: #8a6d00; }
  button:active { transform: translateY(2px); }
  .lib { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .lib-item { width: 86px; text-align: center; cursor: pointer; border: 3px solid var(--dim); padding: 4px; background: #0d1330; }
  .lib-item.active { border-color: var(--yellow); }
  .lib-item canvas { width: 100%; image-rendering: pixelated; display: block; }
  .lib-item .nm { font-size: 8px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  canvas.stage { image-rendering: pixelated; background: transparent; display: block; }
  .stage-wrap { position: relative; margin-top: 8px; border: 3px solid var(--dim); background: #05070f; width: 100%; height: 218px; overflow: hidden; }
  /* 显示框高度由 JS 按 cfg.w:cfg.h 比例计算（上限 = 视口高 × 2/3，防高比例 js 吞掉时间轴）；
     双画布绝对定位 + JS 显式尺寸（fit × 缩放），像素化缩放；超出部分被容器裁剪 */
  .stage-wrap canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; }
  #home-scene { display: none; } /* 初始不载入场景：载入实际 js 后才显示 */
  #stage { position: absolute; }
  .zoom-badge { position: absolute; top: 3px; right: 3px; z-index: 5; font-size: 8px; color: var(--yellow); background: rgba(0,0,0,.65); padding: 1px 5px; display: none; }
  .zoom-badge.on { display: block; }
  .timeline { width: 100%; height: 20px; display: block; margin-top: 6px; border: 2px solid var(--dim); background: #05070f; cursor: crosshair; }
  .scene-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; min-height: 18px; align-items: center; }
  .scene-chip { margin: 0; padding: 2px 6px; min-height: 18px; font-size: 8px; border-width: 2px; }
  .scene-chip.active { border-color: var(--yellow); color: var(--yellow); background: #33270f; }
  .scene-chip.add { border-style: dashed; border-color: var(--dim); color: var(--dim); }
  .scene-chip .x { color: #ff5f7d; margin-left: 3px; }
  .layer-body .hb.sbtn { margin: 0; padding: 2px 4px; min-height: 18px; font-size: 8px; line-height: 1; color: var(--dim); background: #1a2350; }
  .layer-body .hb.sbtn.on { background: var(--yellow); color: #0b1026; }
  .show-pop { z-index: 99; background: #101736; border: 2px solid var(--yellow); padding: 6px; min-width: 170px; box-shadow: 4px 4px 0 #000; }
  .show-pop-title { font-size: 8px; color: var(--dim); margin-bottom: 4px; }
  .show-row-wrap { margin-bottom: 5px; }
  .show-row { display: flex; align-items: center; gap: 6px; width: 100%; margin: 2px 0; padding: 3px 6px; font-size: 9px; min-height: 20px; border-width: 2px; background: #1a2350; color: var(--dim); text-align: left; }
  .show-row.on { border-color: #2fbf6a; color: var(--ink); background: #14301f; }
  .show-row .idx { color: var(--yellow); min-width: 14px; }
  .show-row .nm { flex: 1; }
  .show-row .cnt { font-size: 8px; color: var(--dim); }
  .win-wrap { margin: 2px 0 2px 20px; }
  .win-bar { position: relative; height: 12px; background: #0a0e22; border: 1px solid var(--dim); cursor: copy; user-select: none; }
  .win-seg { position: absolute; top: 0; bottom: 0; background: #2fbf6a; opacity: .85; cursor: grab; box-shadow: inset 0 0 0 1px #1a5c36; }
  .win-seg i { position: absolute; top: 0; bottom: 0; width: 3px; background: #0b1026; cursor: ew-resize; }
  .win-seg .win-hl { left: 0; }
  .win-seg .win-hr { right: 0; }
  .win-info { display: none; }
  .sf-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
  .sf-row .small { padding: 4px 6px; font-size: 9px; margin: 0; min-height: 24px; white-space: nowrap; }
  .sf-sep { width: 1px; height: 18px; background: var(--dim); opacity: .4; flex: none; }
  .sf-l { font-size: 7px; color: var(--dim); margin: 0; white-space: nowrap; }
  .sf-l.nm { color: var(--cyan); }
  .sf-n { width: 38px; padding: 3px 4px; font-size: 10px; }
  .sf-c { width: 28px; height: 22px; padding: 0; border: 2px solid var(--dim); }
  .sf-play { margin-left: auto; flex: none; }
  .hint { font-size: 9px; color: var(--dim); line-height: 1.8; margin-top: 8px; }
  .hint b { color: var(--yellow); }
  .meta { font-size: 9px; color: var(--cyan); min-height: 12px; margin-top: 6px; }
  .cf-group { font-size: 9px; color: var(--yellow); letter-spacing: 1px; margin: 10px 0 2px; border-bottom: 1px dashed #2c3560; padding-bottom: 2px; }
  .props-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
  .props-head label { margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .props-head .small { margin: 0; min-height: 26px; padding: 4px 10px; }
  #cfgform { flex: 1 1 0; height: 0; min-height: 100px; max-height: calc(100vh - 210px); overflow-y: auto; border: 2px solid #0a0e22; padding: 4px; margin-bottom: 6px; background: #0d1330; scrollbar-width: thin; scrollbar-color: #3a4678 #0a0e22; }
  #cfgform::-webkit-scrollbar { width: 8px; }
  #cfgform::-webkit-scrollbar-track { background: #0a0e22; }
  #cfgform::-webkit-scrollbar-thumb { background: #3a4678; border-radius: 4px; }
  #cfgform::-webkit-scrollbar-thumb:hover { background: #4a5890; }
  .layer-card { border: 2px solid #1a2350; background: #101736; margin: 3px 0; }
  .layer-card.global { border-color: var(--dim); }
  .layer-card.img { border-color: #2a3a66; }
  .layer-card.drag { opacity: .5; border-color: var(--yellow); }
  .layer-card.hid { opacity: .45; }
  .layer-head { display: flex; align-items: center; gap: 5px; padding: 4px 5px; cursor: pointer; font-size: 9px; }
  .layer-head:hover { background: #16204a; }
  .lgrip { color: var(--dim); cursor: grab; }
  .layer-z { font-size: 8px; color: var(--yellow); min-width: 22px; }
  .layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .layer-card.img .layer-name { color: var(--cyan); }
  .lcarr { color: var(--yellow); font-size: 8px; width: 8px; }
  .layer-head .hb { margin: 0; padding: 1px 5px; min-height: 16px; font-size: 8px; line-height: 1; }
  .layer-head .hb.hid { background: #33270f; color: var(--dim); }
  .layer-body { border-top: 1px dashed #2c3560; padding: 4px 6px 6px; }
  .cf-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .cf-row label { flex: 1; margin: 0; font-size: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cf-row input[type=number] { width: 76px; }
  .cf-row input[type=text] { width: 110px; }
  .cf-row input[type=color] { width: 44px; height: 26px; padding: 0; border: 2px solid var(--dim); }
  .cf-row input[type=checkbox] { width: auto; }
  .cf-arr { display: flex; gap: 3px; flex-wrap: wrap; }
  .cf-arr input[type=color] { width: 22px; height: 22px; padding: 0; border: 2px solid var(--dim); }
  .cf-ro { font-size: 8px; color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<h1>像素风小动画装配器 · PIXEL SCENE BUILDER</h1>
<div class="sub">任意图片 → 像素化 → 拖拽装配（滚动/闪烁/脉动）→ 打开/保存场景 js（页面内直接改写配置，无需复制粘贴）。开发工具，不随游戏发布。</div>

<div class="cols">
  <!-- 左：素材导入与像素化 -->
  <div class="panel p-import">
    <label>导入素材（任意图片，非 8bit 亦可）</label>
    <div id="drop" class="drop">拖入图片 / 点击选择</div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <label>像素化分辨率（宽，高按比例）</label>
    <div class="row">
      <input id="pw" type="number" min="8" value="160">
      <button id="btn-repx" class="primary" style="margin-top:0">重像素化选中素材</button>
    </div>
    <label>减色色板</label>
    <select id="palette">
      <option value="">无（保持原色）</option>
      <option value="pico8">PICO-8 · 32 色</option>
      <option value="gb">Game Boy · 4 色</option>
      <option value="vga">VGA · 16 色</option>
    </select>
    <label>均匀量化（每通道色阶，0=关）</label>
    <input id="quant" type="range" min="0" max="8" value="0">
    <label>去背景容差（0=关；按左上角颜色抠除）</label>
    <input id="bgtol" type="range" min="0" max="60" value="0">
    <label>素材库（点击选中，再"添加到场景"）</label>
    <div id="lib" class="lib"></div>
    <button id="btn-add" class="primary">添加到场景 →</button>
    <button id="btn-del-src">删除选中素材</button>
    <div class="meta" id="m-import"></div>
  </div>

  <!-- 中：场景文件 + 全局设置 + 画布 + 时间轴 -->
  <div class="panel p-stage">
    <div class="sf-row">
      <button id="btn-open" class="small">打开 js</button>
      <input id="jsfile" type="file" accept=".js,text/javascript,.json" hidden>
      <span class="sf-sep"></span>
      <label class="sf-l nm">全局</label>
      <label class="sf-l nm">宽</label><input id="gw" class="sf-n" type="number" value="320">
      <label class="sf-l nm">高</label><input id="gh" class="sf-n" type="number" value="118">
      <label class="sf-l nm">周期</label><input id="gloop" class="sf-n" type="number" value="48">
      <label class="sf-l nm">背景</label><input id="gbg" class="sf-c" type="color" value="#09132c">
      <label class="sf-l"><input type="checkbox" id="showscene"> 场景层</label>
      <button id="btn-play" class="small primary sf-play">⏸</button>
    </div>
    <div id="stage-wrap" class="stage-wrap">
      <canvas id="home-scene"></canvas>
      <canvas id="stage" class="stage"></canvas>
      <div id="zoom-badge" class="zoom-badge"></div>
    </div>
    <div id="scene-bar" class="scene-bar"></div>
    <canvas id="tl" class="timeline" width="320" height="20"></canvas>
    <div class="meta" id="m-stage"></div>
    <div class="hint">
      画布<b>拖拽</b>移动、<b>拖右下角黄手柄</b>缩放、<b>点击</b>选中（图层栏自动定位展开）；时间轴点击/拖动跳转。
      顶部工具栏「打开 js」读场景文件，图层栏右上角「保存 js」写回——全程页面内完成。
    </div>
  </div>

  <!-- 右：图层栏（元素卡片） -->
  <div class="panel p-props">
    <div class="props-head">
      <label>图层（点击卡片展开调参 · 拖拽排序=z）</label>
      <button id="btn-save" class="small primary">保存 js</button>
    </div>
    <div id="cfgform"></div>
    <div class="meta" id="m-props"></div>
  </div>
</div>

<script src="../public/home-scene.js" onerror="window.__sceneLoadFail = true"></script>
<script>
'use strict';
/* ---------------- 色板 ---------------- */
const PALETTES = {
  pico8: [[0,0,0],[29,43,83],[126,37,83],[0,135,81],[171,82,54],[95,87,79],[194,195,199],[255,241,232],[255,0,77],[255,163,0],[255,236,39],[0,228,54],[41,173,255],[131,118,156],[255,119,168],[255,204,170],[41,54,111],[43,83,120],[112,120,51],[131,143,196],[159,73,28],[83,54,32],[81,31,25],[141,135,123],[79,91,40],[87,79,74],[187,160,119],[142,154,114],[129,156,143],[105,115,98],[178,161,131],[227,204,155]],
  gb: [[15,56,15],[48,98,48],[139,172,15],[155,188,15]],
  vga: [[0,0,0],[128,0,0],[0,128,0],[128,128,0],[0,0,128],[128,0,128],[0,128,128],[192,192,192],[128,128,128],[255,0,0],[0,255,0],[255,255,0],[0,0,255],[255,0,255],[0,255,255],[255,255,255]],
};
const $ = id => document.getElementById(id);

/* ---------------- 状态 ---------------- */
const state = {
  sources: [],        // {id, name, img, dataUrl, w, h}
  selSrc: null,
  elements: [],       // {id, name, src, x, y, w, h, alpha, z, scroll:{speed,span,dir}, anim, animMs}
  selEl: null,
  playing: true,
  t: 0,
  last: 0,
  raf: 0,
  cw: 320, ch: 118,
  showScene: false,   // 初始不预设载入场景：打开实际 js 后场景层才显示（对应画面）
  sceneParamsMode: false, // 已打开参数化场景（HOME_SCENE）：素材写入其 images 层，保存随配置写回
  lastTlScene: -1,    // 图层栏跟随时间轴：当前编辑场景（播放头所在段）
  zoom: 1,            // 画布内容缩放（Alt+滚轮；1=适应显示框）
};

/* ---------------- 像素化管线 ---------------- */
function nearestPalette(r, g, b, pal) {
  let bi = 0, bd = Infinity;
  for (let i = 0; i < pal.length; i++) {
    const dr = r - pal[i][0], dg = g - pal[i][1], db = b - pal[i][2];
    const d = dr * dr + dg * dg + db * db;
    if (d < bd) { bd = d; bi = i; }
  }
  return pal[bi];
}
function pixelate(img, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, w, h);
  g.drawImage(img, 0, 0, w, h);
  const data = g.getImageData(0, 0, w, h);
  const d = data.data;
  const pal = PALETTES[$('palette').value] || null;
  const quant = parseInt($('quant').value) || 0;
  const tol = (parseInt($('bgtol').value) || 0) * 3;
  const bg = tol > 0 ? [d[0], d[1], d[2]] : null;
  const k = quant > 1 ? 255 / (quant - 1) : 0;
  for (let i = 0; i < d.length; i += 4) {
    if (bg) {
      const dist = Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]);
      if (dist <= tol) { d[i + 3] = 0; continue; }
    }
    if (pal) {
      const c2 = nearestPalette(d[i], d[i + 1], d[i + 2], pal);
      d[i] = c2[0]; d[i + 1] = c2[1]; d[i + 2] = c2[2];
    } else if (k) {
      d[i] = Math.round(Math.round(d[i] / k) * k);
      d[i + 1] = Math.round(Math.round(d[i + 1] / k) * k);
      d[i + 2] = Math.round(Math.round(d[i + 2] / k) * k);
    }
  }
  g.putImageData(data, 0, 0);
  return c;
}

/* ---------------- 素材库 ---------------- */
function addSource(img, name, frames) {
  const w = Math.max(8, parseInt($('pw').value) || 160);
  const h = Math.max(4, Math.round(w * (img.naturalHeight / Math.max(1, img.naturalWidth))));
  const c = pixelate(img, w, h);
  const src = { id: 's' + Math.random().toString(36).slice(2, 7), name: name || 'src' + (state.sources.length + 1), img: img, dataUrl: c.toDataURL('image/png'), w: w, h: h, frames: frames || 1 };
  state.sources.push(src);
  state.selSrc = src.id;
  renderLib();
  $('m-import').textContent = '已导入 ' + src.name + '（像素化 ' + w + '×' + h + (src.frames > 1 ? ' · ' + src.frames + '帧' : '') + '）——点「添加到场景」';
}
function renderLib() {
  const lib = $('lib');
  lib.innerHTML = '';
  for (const s of state.sources) {
    const d = document.createElement('div');
    d.className = 'lib-item' + (state.selSrc === s.id ? ' active' : '');
    const cv = document.createElement('canvas');
    cv.width = s.w; cv.height = s.h;
    const g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    const im = new Image();
    im.onload = () => { g.clearRect(0, 0, s.w, s.h); g.drawImage(im, 0, 0); };
    im.src = s.dataUrl;
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = s.name + ' ' + s.w + '×' + s.h;
    d.appendChild(cv);
    d.appendChild(nm);
    d.onclick = () => { state.selSrc = s.id; renderLib(); };
    lib.appendChild(d);
  }
  $('btn-add').disabled = !state.sources.length;
}
function selSource() { return state.sources.find(s => s.id === state.selSrc); }

/* ---------------- 元素 ---------------- */
function addElement(src) {
  const el = {
    id: 'e' + Math.random().toString(36).slice(2, 7),
    name: src.name,
    src: src.dataUrl,
    x: Math.floor((state.cw - src.w) / 2), y: Math.floor((state.ch - src.h) / 2),
    w: src.w, h: src.h,
    alpha: 1, z: 99, // 素材浮于程序化场景之上（home-scene 的 images 画在程序化层之后）
    scroll: { speed: 0, span: src.w, dir: 'left' },
    anim: 'static', animMs: 700,
    frames: src.frames || 1, fps: 8,
  };
  state.elements.push(el);
  if (state.sceneParamsMode && window.HOME_SCENE) {
    // 场景参数模式：同一引用写入 HOME_SCENE.images → 场景层实时渲染 + 保存随配置写回
    (window.HOME_SCENE.images = window.HOME_SCENE.images || []).push(el);
  }
  state.selEl = el.id;
  ensureImage(el);
  buildLayerList(layerCfg());
  renderStage();
  renderTimeline();
  $('m-stage').textContent = '已添加 ' + el.name + '——拖拽调位置，点击卡片/画布展开参数' + (state.sceneParamsMode ? '（将随场景配置一起保存）' : '');
}
function selEl() { return state.elements.find(e => e.id === state.selEl); }

/* ---------------- 场景渲染（预览与导出共用逻辑） ---------------- */
function scrollOffset(e, t) {
  if (!e.scroll || !e.scroll.speed) return 0;
  const span = e.scroll.span || e.w || 1;
  const off = (t * e.scroll.speed) % span;
  return e.scroll.dir === 'right' ? off : -off;
}
function elementAlpha(e, t) {
  if (e.anim === 'blink') {
    const on = Math.floor((t * 1000) / Math.max(50, e.animMs)) % 2 === 0;
    return e.alpha * (on ? 1 : 0.25);
  }
  return e.alpha;
}
function elementScale(e, t) {
  if (e.anim === 'pulse') return 1 + 0.15 * Math.sin((t * 1000 / Math.max(200, e.animMs)) * Math.PI * 2);
  return 1;
}
function drawElement(ctx, e, t, imgMap) {
  const img = imgMap[e.id] || e._img;
  if (!img || !img.width) return;
  // 多帧（sprite sheet 横向）：frames > 1 时按 fps 取帧
  const frames = e.frames > 1 ? e.frames : 1;
  const fx = frames > 1 ? Math.floor(t * (e.fps || 8)) % frames : 0;
  const sw = frames > 1 ? Math.floor(img.width / frames) : img.width;
  const scale = elementScale(e, t);
  const w = e.w * scale, h = e.h * scale;
  const ox = scrollOffset(e, t);
  ctx.globalAlpha = elementAlpha(e, t);
  const blit = (dx, dy) => ctx.drawImage(img, fx * sw, 0, sw, img.height, Math.round(dx), Math.round(dy), w, h);
  if (e.scroll && e.scroll.speed && e.scroll.span) {
    const span = e.scroll.span;
    const dir = e.scroll.dir === 'right' ? 1 : -1;
    const n = Math.ceil(state.cw / span) + 3;

// 多文件导入：1 张 = 单素材；多张 = 合成横向 sprite sheet（帧序列素材）
function loadFiles(files) {
  if (!files || !files.length) return;
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) { $('m-import').textContent = '请选择图片文件'; return; }
  if (list.length === 1) {
    const f = list[0];
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => addSource(img, f.name.replace(/\.[^.]+$/, '').slice(0, 10), 1);
      img.onerror = () => { $('m-import').textContent = '图片解码失败'; };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
    return;
  }
  // 多张 → 逐张像素化 → 横向拼 sheet
  const imgs = [];
  let done = 0;
  for (const f of list) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => { imgs.push(img); done++; if (done === list.length) finishCompose(); };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  }
  function finishCompose() {
    const w = Math.max(8, parseInt($('pw').value) || 160);
    const h = Math.max(4, Math.round(w * (imgs[0].naturalHeight / Math.max(1, imgs[0].naturalWidth))));
    const sheet = document.createElement('canvas');
    sheet.width = w * imgs.length; sheet.height = h;
    const g = sheet.getContext('2d');
    g.imageSmoothingEnabled = false;
    imgs.forEach((im, i) => g.drawImage(pixelate(im, w, h), i * w, 0));
    const src = {
      id: 's' + Math.random().toString(36).slice(2, 7),
      name: (list[0].name.replace(/\.[^.$]+$/, '').slice(0, 8) || 'frame') + '×' + imgs.length,
      img: sheet,
      dataUrl: sheet.toDataURL('image/png'),
      w: w, h: h, frames: imgs.length,
    };
    state.sources.push(src);
    state.selSrc = src.id;
    renderLib();
    $('m-import').textContent = '已合成 ' + imgs.length + ' 帧素材「' + src.name + '」（' + w + '×' + h + ' ×' + imgs.length + ' 帧）——点「添加到场景」';
  }
}

// 提取 js 中的对象字面量（平衡括号，支持嵌套；JS 对象字面量用求值解析）
// 返回 {obj, start, end} 或 {err}（解析失败）或 null（未找到声明）
function extractObj(text, name) {
  const re = new RegExp('(?:const|let|var)\\s+' + name + '\\s*=\\s*(\\{)', 'm');
  const m = re.exec(text);
  if (!m) return null;
  let i = m.index + m[0].indexOf('{');
  const start = i;
  let depth = 0;
  for (; i < text.length; i++) {
    if (text[i] === '{') depth++;
    else if (text[i] === '}') { depth--; if (depth === 0) { i++; break; } }
  }
  const body = text.slice(start, i);
  try {
    const obj = new Function('return (' + body + ')')();
    return { obj, start, end: i };
  } catch (e) {
    return { err: '解析 ' + name + ' 失败：' + e.message };
  }
}

/* ---------------- 规范自检（详见 SCENE_SPEC.md） ---------------- */
function checkSceneSpec(cfg) {
  const warns = [];
  const n = cfg.scenes && cfg.scenes.length ? cfg.scenes.length : null;
  for (const [key, el] of Object.entries(cfg)) {
    if (!el || typeof el !== 'object' || Array.isArray(el) || key === 'images') continue;
    for (const k of Object.keys(el)) {
      // 1) 按场景散键：x3 / color3 等（存在基础键）
      const m = /^(.*?)(\d+)$/.exec(k);
      if (m && m[1] && Object.prototype.hasOwnProperty.call(el, m[1])) {
        warns.push('「' + key + '.' + k + '」疑似按场景散键——建议合并为 ' + m[1] + ': [v0,v1,…] 按场景数组（参数轨道）');
      }
      // 2) 数值数组长度 ≠ 场景数：只读结构数据
      const v = el[k];
      if (Array.isArray(v) && v.length > 1 && v.every(x => typeof x === 'number') && n && v.length !== n) {
        warns.push('「' + key + '.' + k + '」为数值数组（长度 ' + v.length + ' ≠ 场景数 ' + n + '）——仅展示不可编辑');
      }

    for (const [key, el] of Object.entries(cfg)) {

// 保存：File System Access API（localhost/https）优先，失败/不支持则下载
async function saveToFile(filename, content) {
  try {
    if (window.showSaveFilePicker) {
      const h = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'JavaScript', accept: { 'text/javascript': ['.js'] } }],
      });
      const w = await h.createWritable();
      await w.write(content);
      await w.close();
      $('m-props').textContent = '已写回文件：' + h.name;
      return;
    }
  } catch (e) { /* 用户取消或环境不支持 */ }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: 'text/javascript' }));
  a.download = filename;
  a.click();
  $('m-props').textContent = '当前环境不支持直接写文件，已触发下载：' + filename;
}

let tlDragBorder = null;
function tlBorderHit(ev) {
  const cfg = window.HOME_SCENE;
  if (!cfg || !state.sceneParamsMode || !(cfg.scenes && cfg.scenes.length)) return -1;
  const r = $('tl').getBoundingClientRect();
  const frac = (ev.clientX - r.left) / Math.max(1, r.width);
  const bounds = currentBorders(cfg);
  const loop = tlLoop();
  for (let i = 0; i < bounds.length; i++) {
    if (Math.abs(frac - bounds[i] / loop) < 6 / Math.max(1, r.width)) return i;
  }
  return -1;
}
$('tl').addEventListener('pointerdown', ev => {
  const bi = tlBorderHit(ev);
  if (bi >= 0) { tlDragBorder = bi; ev.preventDefault(); return; }
  tlDragging = true;
  tlSeek(ev);
});
window.addEventListener('pointermove', ev => {
  if (tlDragBorder != null) {
    const cfg = window.HOME_SCENE;
    if (!cfg) { tlDragBorder = null; return; }
    const loop = tlLoop();
    const r = $('tl').getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (ev.clientX - r.left) / Math.max(1, r.width)));
    const bounds = cfg.sceneBorders = currentBorders(cfg); // 拖拽即落定 sceneBorders
    const prev = tlDragBorder > 0 ? bounds[tlDragBorder - 1] : 0;
    const next = tlDragBorder < bounds.length - 1 ? bounds[tlDragBorder + 1] : loop;
    bounds[tlDragBorder] = Math.max(prev + 0.5, Math.min(next - 0.5, frac * loop));
    renderTimeline();
    if (window.HomeScene && HomeScene.seek) HomeScene.seek(state.t);
    return;
  }
  if (tlDragging) tlSeek(ev);
});
window.addEventListener('pointerup', () => { tlDragging = false; tlDragBorder = null; });

/* ---------------- 场景编辑（增/删/改名；时间轴边界拖拽联动） ---------------- */
function syncSceneArrays(cfg, oldN, newN) {
  // 长度 == 旧场景数的数值/字符串数组视为「按场景数组」→ 补齐（取末位）/截断
  const fix = o => {
    for (const k of Object.keys(o)) {
      const v = o[k];
      if (Array.isArray(v) && v.length === oldN && v.every(x => typeof x === 'number' || typeof x === 'string')) {
        while (v.length < newN) v.push(v.length ? v[v.length - 1] : 0);
        if (v.length > newN) v.length = newN;
      }
    }
  };
  for (const k of Object.keys(cfg)) {
    const v = cfg[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) fix(v);
  }
  (cfg.images || []).forEach(fix);
}
function renderSceneBar() {
  const bar = $('scene-bar');
  const cfg = window.HOME_SCENE;
  if (!cfg || !state.sceneParamsMode || !(cfg.scenes && cfg.scenes.length)) { bar.innerHTML = ''; return; }
  const cur = tlScene();
  bar.innerHTML = '';
  cfg.scenes.forEach((nm, i) => {
    const chip = document.createElement('button');
    chip.className = 'scene-chip' + (cur === i ? ' active' : '');
    chip.title = '点击 = 切换编辑场景（跳播放头）· 双击 = 改名 · ✕ = 删除';
    chip.innerHTML = escapeHtml(nm) + ' <span class="x">✕</span>';
    chip.addEventListener('click', ev => {
      ev.stopPropagation();
      if (ev.target.classList && ev.target.classList.contains('x')) {
        if (!window.confirm('删除场景「' + nm + '」？按场景参数将截断，显示时间窗口将重排。')) return;
        deleteScene(i);
      } else {
        jumpScene(i);
      }
    });
    chip.addEventListener('dblclick', ev => {
      ev.stopPropagation();
      if (ev.target.classList && ev.target.classList.contains('x')) return;
      const v = window.prompt('场景名（第 ' + (i + 1) + ' 段）：', nm);
      if (v && v.trim()) { cfg.scenes[i] = v.trim(); renderSceneBar(); renderTimeline(); }
    });
    bar.appendChild(chip);
  });
  const add = document.createElement('button');
  add.className = 'scene-chip add';
  add.textContent = '+ 场景';
  add.title = '新增场景（等分插入，按场景数组自动补齐）';
  add.addEventListener('click', () => { addScene(); });
  bar.appendChild(add);
}
function jumpScene(i) {
  // 切换编辑场景：播放头跳到该场景起点，图层栏/时间轴随之更新
  const cfg = window.HOME_SCENE; if (!cfg) return;
  const [s0] = tlSceneRange(i);
  state.t = s0;
  state.lastTlScene = i;
  if (window.HomeScene && HomeScene.seek) HomeScene.seek(state.t);
  buildLayerList(layerCfg());
  renderSceneBar();
  renderStage();
  renderTimeline();
}
function addScene() {
  const cfg = window.HOME_SCENE; if (!cfg) return;
  cfg.scenes = cfg.scenes || [];
  const oldN = cfg.scenes.length;
  const v = window.prompt('新场景名：', '场景' + (oldN + 1));
  if (!v || !v.trim()) return;
  cfg.scenes.push(v.trim());
  cfg.sceneBorders = equalBorders(cfg, cfg.scenes.length);
  syncSceneArrays(cfg, oldN, cfg.scenes.length);
  renderSceneBar(); renderTimeline();
  if (window.HomeScene && HomeScene.seek) HomeScene.seek(state.t);
}
function deleteScene(i) {
  const cfg = window.HOME_SCENE; if (!cfg) return;
  const oldN = cfg.scenes.length;
  cfg.scenes.splice(i, 1);
  if (!cfg.scenes.length) cfg.scenes = ['场景'];
  cfg.sceneBorders = equalBorders(cfg, cfg.scenes.length);
  syncSceneArrays(cfg, oldN, cfg.scenes.length);
  renderSceneBar(); renderTimeline();
  if (window.HomeScene && HomeScene.seek) HomeScene.seek(state.t);
}

/* ---------------- 场景层（home-scene.js 叠底）与画布尺寸 ---------------- */
// home-scene.js 硬编码 320×118：场景层开启时画布锁定该尺寸（素材层对齐叠加），关闭时可自定义
function syncCanvasSize() {
  const cfg = window.HOME_SCENE;
  if (state.showScene && cfg) {
    state.cw = cfg.w || 320; state.ch = cfg.h || 118;
  } else {
    state.cw = Math.max(32, parseInt($('gw').value) || 320);
    state.ch = Math.max(32, parseInt($('gh').value) || 118);
  }
}
$('showscene').addEventListener('change', () => {
  state.showScene = $('showscene').checked;
  $('home-scene').style.display = state.showScene ? 'block' : 'none';
  syncCanvasSize();
  renderStage();
  renderTimeline();
});

/* ---------------- 启动 ---------------- */
renderLib();
syncGlobals();
ensureAllImages();
renderSceneBar();
renderTimeline();
syncCanvasSize();
resizeStageWrap(); // 显示框初始高度（默认 320×118 比例）
$('home-scene').style.display = state.showScene ? 'block' : 'none';
if (window.__sceneLoadFail) $('m-stage').textContent = '⚠ 场景层加载失败：未找到 ../public/home-scene.js（可取消勾选"场景层"）';
renderStage();
state.last = performance.now();
state.raf = requestAnimationFrame(loop);
</script>
